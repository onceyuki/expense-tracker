<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ledgerly — Budget & Expense Tracker</title>
    <script>
      // Apply theme before first paint to avoid flash
      const stored = localStorage.getItem('et_dark');
      const dark = stored === null ? matchMedia('(prefers-color-scheme: dark)').matches : stored === '1';
      if (dark) document.documentElement.classList.add('dark');
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
